services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: askdocs
      POSTGRES_USER: askdocs
      POSTGRES_PASSWORD: askdocs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askdocs"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    build: ./elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -v red"]
      interval: 10s
      timeout: 10s
      retries: 10

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      ES_URL: http://elasticsearch:9200
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - hf_cache:/root/.cache/huggingface

volumes:
  pgdata:
  esdata:
  ollama_data:
  hf_cache: