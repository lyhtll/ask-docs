[project]
name = "askdocs"
version = "0.1.0"
description = "RAG 기반 문서 Q&A 시스템"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",      # 파일 업로드

    # DB
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",              # SQLAlchemy async 필수
    "asyncpg>=0.29.0",              # PostgreSQL 비동기 드라이버
    "pgvector>=0.2.5",              # pgvector SQLAlchemy 타입

    # 설정
    "pydantic-settings>=2.0.0",

    # 문서 로딩
    "pypdf>=4.0.0",
    "aiofiles>=23.0.0",

    # 임베딩
    "sentence-transformers>=3.0.0",

    # 청킹
    "langchain-text-splitters>=0.0.1",

    # 검색
    "elasticsearch[async]>=8.0.0,<9.0.0",

    # 파이프라인
    "langgraph>=0.1.0",
    "langchain>=0.2.0",

    # LLM
    "ollama>=0.2.0",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.1.0",
    "datasets>=2.0.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",               # FastAPI 테스트용
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askdocs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"